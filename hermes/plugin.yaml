{
  "manifest_version": 2,
  "name": "masons",
  "version": "0.1.14",
  "description": "MASONS Session communication in the canonical Hermes gateway",
  "kind": "platform",
  "provides_tools": [
    "masons_link",
    "masons_look",
    "masons_send",
    "masons_connections",
    "masons_choose_session",
    "masons_status",
    "masons_profile",
    "masons_upgrade"
  ],
  "provides_hooks": [
    "pre_llm_call",
    "post_llm_call",
    "pre_api_request",
    "post_api_request",
    "api_request_error",
    "on_session_end",
    "agent_loop_stopped",
    "on_session_finalize",
    "on_session_reset"
  ],
  "provides_middleware": [
    "tool_execution"
  ],
  "python_dependencies": [
    "aiohttp>=3.14.3,<4",
    "cryptography>=46,<51"
  ],
  "platforms": [
    "masons"
  ],
  "license": "SEE LICENSE IN LICENSE"
}
